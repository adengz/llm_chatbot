services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data" # -sharedDb ensures consistent access
    volumes:
      - ./dynamodb_data:/home/dynamodblocal/data

  dynamodb-local-init:
    image: amazon/aws-cli
    env_file:
      - .env
    depends_on: 
      - dynamodb-local
    entrypoint: /bin/sh
    command: >
      -c "until aws dynamodb list-tables --endpoint-url $${AWS_ENDPOINT_URL} > /dev/null 2>&1; do
      echo 'Waiting for DynamoDB...';
      sleep 1;
      done;
      (aws dynamodb describe-table --endpoint-url $${AWS_ENDPOINT_URL} --table-name $${DYNAMODB_CONVERSATIONS_TABLE} > /dev/null 2>&1 || 
      aws dynamodb create-table --endpoint-url $${AWS_ENDPOINT_URL} --table-name $${DYNAMODB_CONVERSATIONS_TABLE} --attribute-definitions AttributeName=user_id,AttributeType=N AttributeName=conversation_id,AttributeType=S --key-schema AttributeName=user_id,KeyType=HASH AttributeName=conversation_id,KeyType=RANGE --billing-mode PAY_PER_REQUEST) &&
      (aws dynamodb describe-table --endpoint-url $${AWS_ENDPOINT_URL} --table-name $${DYNAMODB_MESSAGES_TABLE} > /dev/null 2>&1 || 
      aws dynamodb create-table --endpoint-url $${AWS_ENDPOINT_URL} --table-name $${DYNAMODB_MESSAGES_TABLE} --attribute-definitions AttributeName=conversation_id,AttributeType=S AttributeName=created_at,AttributeType=S AttributeName=type-created_at,AttributeType=S --key-schema AttributeName=conversation_id,KeyType=HASH AttributeName=created_at,KeyType=RANGE --local-secondary-indexes 'IndexName=type-created_at-idx,KeySchema=[{AttributeName=conversation_id,KeyType=HASH},{AttributeName=type-created_at,KeyType=RANGE}],Projection={ProjectionType=KEYS_ONLY}' --billing-mode PAY_PER_REQUEST)"

  backend:
    build: ./backend
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on: 
      dynamodb-local-init:
        condition: service_completed_successfully
    secrets:
      - ollama_api_key
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:80/health\")'"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

secrets:
  ollama_api_key:
    environment: OLLAMA_API_KEY