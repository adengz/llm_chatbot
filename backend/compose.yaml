services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data" # -sharedDb ensures consistent access
    volumes:
      - ./dynamodb_data:/home/dynamodblocal/data

  dynamodb-local-init:
    image: amazon/aws-cli
    env_file:
      - .env
    depends_on: 
      - dynamodb-local
    entrypoint: /bin/sh
    command: >
      -c "until aws dynamodb list-tables --endpoint-url $${DYNAMODB_ENDPOINT} > /dev/null 2>&1; do
      echo 'Waiting for DynamoDB...';
      sleep 1;
      done;
      (aws dynamodb describe-table --endpoint-url $${DYNAMODB_ENDPOINT} --table-name $${DYNAMODB_CONVERSATIONS_TABLE} > /dev/null 2>&1 || 
      aws dynamodb create-table --endpoint-url $${DYNAMODB_ENDPOINT} --table-name $${DYNAMODB_CONVERSATIONS_TABLE} --attribute-definitions AttributeName=user_id,AttributeType=N AttributeName=conversation_id,AttributeType=S --key-schema AttributeName=user_id,KeyType=HASH AttributeName=conversation_id,KeyType=RANGE --billing-mode PAY_PER_REQUEST) &&
      (aws dynamodb describe-table --endpoint-url $${DYNAMODB_ENDPOINT} --table-name $${DYNAMODB_MESSAGES_TABLE} > /dev/null 2>&1 || 
      aws dynamodb create-table --endpoint-url $${DYNAMODB_ENDPOINT} --table-name $${DYNAMODB_MESSAGES_TABLE} --attribute-definitions AttributeName=conversation_id,AttributeType=S AttributeName=created_at,AttributeType=S --key-schema AttributeName=conversation_id,KeyType=HASH AttributeName=created_at,KeyType=RANGE --billing-mode PAY_PER_REQUEST)"